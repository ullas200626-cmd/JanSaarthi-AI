
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JanSaarthi AI | Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #172033;
        }
        main {
            background: white;
            padding: 28px;
            border-radius: 12px;
            width: min(360px, calc(100% - 56px));
            box-shadow: 0 4px 18px #14213d18;
        }
        h1 { color: #123b67; }
        label { display: block; margin-top: 16px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            color: white;
            background: #1769aa;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .error { color: #b42318; }
        .notice { color: #5d6b82; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <h1>JanSaarthi AI</h1>
        <p>Administrator sign in</p>

        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username"
                   required maxlength="100">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>

        <p class="notice">
            Demonstration dashboard only. Records are not official government
            complaints.
        </p>
    </main>
</body>
</html>
